apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asdo.fullname" . }}-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: asdo
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asdo.fullname" . }}-api
spec:
  podSelector:
    matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "api") | indent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "web") | indent 14 }}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "otel-collector") | indent 14 }}
      ports:
        - protocol: TCP
          port: 4318
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asdo.fullname" . }}-web
spec:
  podSelector:
    matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "web") | indent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - to:
        - podSelector:
            matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "api") | indent 14 }}
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "asdo.fullname" . }}-otel-collector
spec:
  podSelector:
    matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "otel-collector") | indent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "api") | indent 14 }}
      ports:
        - protocol: TCP
          port: 4318
