apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "asdo.fullname" . }}-web
  labels:
{{ include "asdo.componentLabels" (dict "root" . "component" "web") | indent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
{{ include "asdo.componentLabels" (dict "root" . "component" "web") | indent 6 }}
  template:
    metadata:
      labels:
{{ include "asdo.componentLabels" (dict "root" . "component" "web") | indent 8 }}
    spec:
      serviceAccountName: {{ include "asdo.fullname" . }}-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "asdo.image" (dict "root" . "image" .Values.web.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "asdo.fullname" . }}-web-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
{{ toYaml .Values.web.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
