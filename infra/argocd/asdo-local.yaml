apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asdo-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/roytechworkforce/autonomous-software-delivery-organization
    targetRevision: main
    path: infra/helm/asdo
  destination:
    server: https://kubernetes.default.svc
    namespace: asdo
  syncPolicy:
    automated: null
    syncOptions:
      - CreateNamespace=true
